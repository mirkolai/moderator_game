services:

  backend:
    build: ./backend
    container_name: moderator_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # The browser resolves /api relative to the page origin;
        # nginx inside the frontend container forwards it to the backend.
        VITE_API_BASE: /api
    container_name: moderator_frontend
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
